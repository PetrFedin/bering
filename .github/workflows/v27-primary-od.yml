name: Bering V27 public XLS provenance and 24-month OD QA

on:
  pull_request:
    paths:
      - 'scripts/v27_primary_xls.py'
      - 'scripts/v27_monthly_od_gate.py'
      - 'tests/test_v27_*.py'
      - 'quality/fuzz_v27.py'
      - 'data/public/V27_*'
      - 'data/od/V27_*'
      - '.github/workflows/v27-primary-od.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checked-out SHA
        run: git rev-parse HEAD
      - name: Run full historical and V27 regression suite on one SHA
        run: python -m unittest discover -s tests -v
      - name: Published KASCO list rates are VAT-inclusive CY-CY, never project contribution
        run: |
          python scripts/v27_public_rates.py \
            --input data/public/V27_KASCO_LIST_RATE_20261101.json \
            --out v27_list_rate_receipt.json
          python - <<'PY'
          import json
          r=json.load(open('v27_list_rate_receipt.json'))
          assert r['status']=='PUBLIC_LIST_RATE_ONLY'
          assert r['quoted_40ft_dry_rub_incl_vat']=='239767'
          assert r['quoted_40ft_reefer_rub_incl_vat']=='315000'
          assert r['reefer_minus_dry_rub_incl_vat']=='75233'
          assert r['reefer_vs_dry_premium_percent']=='31.38'
          assert r['d2d_rub'] is None
          assert r['group_incremental_margin_rub'] is None
          assert r['bankable_revenue_approved'] is False
          PY
      - name: Robustness for malformed research inputs
        run: python quality/fuzz_v27.py
      - name: Missing actual OD evidence must not produce an investment forecast
        run: |
          python scripts/v27_monthly_od_gate.py \
            --operator-monthly data/public/V27_PORT_MONTHLY_UNVERIFIED.json \
            --od-24m data/od/V27_GROUP_24M_UNVERIFIED.json \
            --out v27_baseline_receipt.json
          python - <<'PY'
          import json
          r=json.load(open('v27_baseline_receipt.json'))
          assert r['operator_monthly']['status']=='HOLD'
          assert r['operator_monthly']['reported_months']==0
          assert r['group_24m_od']['status']=='HOLD'
          assert r['group_24m_od']['documented_months']==0
          assert r['group_24m_od']['projection'] is None
          assert r['bankable_revenue_approved'] is False
          assert r['investment_approved'] is False
          PY
      - name: V23-V25 commercial, documentary and V26 proof gates remain HOLD
        run: |
          python scripts/release_commercial_v25.py --repo . --out v27_existing_commercial_receipt.json
          python scripts/evidence_readiness_v26.py \
            --intake data/pilots/V26_EMPTY_PROOF_INTAKE.json \
            --out v27_existing_evidence_receipt.json
          python - <<'PY'
          import json
          a=json.load(open('v27_existing_commercial_receipt.json'))
          b=json.load(open('v27_existing_evidence_receipt.json'))
          assert a['status']=='HOLD' and a['investment_approved'] is False
          assert b['status']=='HOLD' and b['total_proof_categories']==29
          assert b['source_categories_with_locally_verified_bytes']==0
          PY
      - name: Summarize audit results without artifact storage
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary=['## V27 baseline and documentary controls', '', 'No actual OD or revenue admitted.']
          for filename in ('v27_baseline_receipt.json','v27_existing_commercial_receipt.json','v27_existing_evidence_receipt.json'):
              p=Path(filename)
              if not p.exists():
                  summary.append(f'- {filename}: missing receipt')
                  continue
              d=json.loads(p.read_text())
              if filename=='v27_baseline_receipt.json':
                  summary.append(f"- Operator monthly: {d['operator_monthly']['status']}, {d['operator_monthly']['reported_months']}/24 source months")
                  summary.append(f"- Group OD: {d['group_24m_od']['status']}, {d['group_24m_od']['source_backed_months']}/96 source-backed months")
              else:
                  summary.append(f"- {filename}: {d['status']}")
          text='\n'.join(summary)+'\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:output.write(text)
          PY

  primary-originals:
    needs: local-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical XLS read-only parser
        run: python -m pip install --disable-pip-version-check 'xlrd==2.0.2'
      - name: Fetch and inspect exactly four public operator XLS sources
        run: |
          python scripts/v27_primary_xls.py \
            --output-dir v27_primary_review \
            --require-all \
            --print-candidates 45
      - name: Post public source provenance to workflow summary without using artifact storage
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('v27_primary_review/primary_xls_receipt.json')
          if not p.exists():
              msg='## V27 public XLS\nOriginal source receipt not available. No data admitted.\n'
          else:
              d=json.loads(p.read_text(encoding='utf-8'))
              msg='## V27 publicly posted original XLS files\n\n'
              msg+='Acquisition status: '+d['status']+'\n\n'
              for name,rec in d['sources'].items():
                  msg+=f"- {name}: {rec['status']}; raw-byte SHA-256={rec.get('file_sha256')}; raw bytes={rec.get('file_bytes')}; reason={rec.get('reason')}; candidate cells={len(rec.get('candidate_rows',[]))}\n"
              msg+='\nCandidate cells are not authenticated throughput, 40ft OD or new Bering demand.\n'
          print(msg)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(msg)
          PY
