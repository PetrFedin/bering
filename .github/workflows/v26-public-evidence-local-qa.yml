name: Bering V26 research-source quality (manual; not commercial admission)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-evidence-and-local-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pinned topic commit
        uses: actions/checkout@v4
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed public data and document readiness tests
        run: |
          python scripts/offline_qa_v26.py \
            --repo . \
            --receipt /tmp/bering-v26-local-receipt.json
          python quality/fuzz_v26.py
      - name: Assert local receipt is never treated as investment pass
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/bering-v26-local-receipt.json'))
          assert r['status']=='LOCAL_QA_PASS_REMOTE_CI_UNVERIFIED'
          assert r['market_report']['commercial_gate']=='HOLD'
          assert r['documentary_baseline']['status']=='HOLD'
          assert r['evidence_intake_baseline']['status']=='HOLD'
          assert r['market_report']['project_incremental_group_cm_rub'] is None
          assert r['project_investment_approved'] is False
          PY
