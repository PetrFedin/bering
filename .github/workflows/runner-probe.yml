name: Bering CI Runner Probe (no checkout)
on:
  push:
    branches:
      - ci/runner-probe-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify GitHub runner starts
        run: |
          echo "RUNNER_STARTED"
          echo "Runner OS=$RUNNER_OS"
          python3 --version
