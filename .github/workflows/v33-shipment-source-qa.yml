name: Bering V33 shipment proof quality — research HOLD

on:
  pull_request:
    paths:
      - 'scripts/v33_*'
      - 'tests/test_v33_*'
      - 'data/evidence/V33_*'
      - 'docs/V33_*'
      - '.github/workflows/v33-shipment-source-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shipment-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record exact checkout SHA
        run: git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run full unit regression
        run: python -m unittest discover -s tests -v
      - name: Prove missing source cannot become bankability
        run: |
          python scripts/v33_shipment_proof_quality.py --repo . --out v33_readonly.json
          python - <<'PY'
          import json
          r=json.load(open('v33_readonly.json'))
          assert r['status']=='NO_SOURCE_RECORDS_IN_SCOPE',r['errors']
          assert r['monthly_coverage_target']==96
          assert r['claimed_attested_months']==0
          assert r['confirmed_attested_months']==0
          assert r['new_paid_bering_40ft'] is None
          assert r['incremental_group_contribution_margin_rub'] is None
          assert r['bering_npv_rub'] is None
          assert r['investment_approved'] is False
          PY
      - name: Previous controls remain HOLD
        run: |
          python scripts/v28_group_decision.py --repo . --out v33_v28.json
          python scripts/v29_timeline_claim_guard.py --out v33_v29.json
          python scripts/v30_primary_evidence_gate.py --repo . --out v33_v30.json
          python scripts/v31_regulatory_stage_gate.py --out v33_v31.json
          python scripts/v32_decision_evidence_gate.py --repo . --out v33_v32.json
          python - <<'PY'
          import json
          paths={'v33_v28.json':'HOLD','v33_v29.json':'RESEARCH_CONTEXT_ONLY',
                 'v33_v30.json':'HOLD','v33_v31.json':'RESEARCH_CONTEXT_ONLY',
                 'v33_v32.json':'HOLD'}
          for file, expected in paths.items():
              r=json.load(open(file))
              assert r['status']==expected,(file,r.get('errors'))
              assert r['investment_approved'] is False
          PY
