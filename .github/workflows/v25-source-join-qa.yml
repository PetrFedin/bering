name: Bering V25 source-linked cargo reconciliation (research only)

on:
  workflow_dispatch:
  push:
    branches: [audit/v25-source-linked-consignments-20261031]
  pull_request:
    paths:
      - 'scripts/source_join_v25.py'
      - 'tests/test_source_join_v25.py'
      - 'data/pilots/V25_no_verified_consignments.json'
      - '.github/workflows/v25-source-join-qa.yml'
permissions:
  contents: read
jobs:
  source-link-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source and unverified canonical inputs
        run: |
          python -m compileall -q scripts/source_join_v25.py
          python -m json.tool data/pilots/V25_no_verified_consignments.json > /dev/null
      - name: Run 28 synthetic tests, never infer real revenue
        run: |
          python -m unittest discover -s tests -p 'test_source_join_v25.py' -v
      - name: Unverified cargo must yield HOLD and null money
        run: |
          set +e
          python scripts/source_join_v25.py --input data/pilots/V25_no_verified_consignments.json --output bering_v25_hold_receipt.json
          code=$?
          set -e
          test "$code" -eq 3
          python - <<'PY'
          import json
          x=json.load(open('bering_v25_hold_receipt.json',encoding='utf-8'))
          assert x['status']=='HOLD'
          assert x['source_records']==0
          assert x['group_incremental_cm_rub'] is None
          assert x['unique_paid_40ft'] is None
          assert x['bankable_revenue_approved'] is False
          assert x['investment_approved'] is False
          PY
      - name: Retain research HOLD receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bering-v25-no-real-cargo-receipt
          path: bering_v25_hold_receipt.json
          if-no-files-found: ignore
